<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Meloir">
  <style>
    .logo { transform-origin: 50px 50px; animation: breathe 1.5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .55; }
      50% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  </style>
  <g class="logo">
    <circle cx="50" cy="50" r="50" fill="#fff"/>
    <path fill="#000" d="M26 27h11l13 22 13-22h11v46H63V46L50 68 37 46v27H26z"/>
  </g>
</svg>
